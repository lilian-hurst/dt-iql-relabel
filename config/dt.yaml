# Decision Transformer — hyperparamètres Gym du papier (Chen et al. 2021, Table 8 / code officiel gym/).
model:
  context_len: 20         # K
  embed_dim: 128
  n_layers: 3
  n_heads: 1
  dropout: 0.1
  activation: relu
  max_timestep: 4096      # taille de la table d'embedding temporel
  tanh_action: true       # actions D4RL dans [-1, 1]

train:
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 10000
  grad_clip: 0.25
  max_steps: 100000       # 10 itérations x 10k pas dans le code officiel
  log_every: 1000
  eval_every: 10000       # 0 = pas d'évaluation intermédiaire
  checkpoint_every: 50000

# Échelle des RTG fournis au réseau (rtg / return_scale)
return_scale:
  halfcheetah: 1000.0
  hopper: 1000.0
  walker2d: 1000.0
  kitchen: 1.0

# RTG cibles à l'évaluation (valeurs du papier) ; le meilleur est reporté.
target_returns:
  halfcheetah: [12000.0, 6000.0]
  hopper: [3600.0, 1800.0]
  walker2d: [5000.0, 2500.0]
  kitchen: [4.0, 3.0]

eval:
  episodes: 10            # évaluations intermédiaires (rapides)
  final_episodes: 100     # évaluation finale reportée (code officiel : 100 épisodes)
